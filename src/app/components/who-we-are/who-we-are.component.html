<div class="page-container">

    <section class="section artifex-intro">
        <div class="content-split">
            <div class="text-col" data-aos="fade-up">
                <span class="badge">Who We Are</span>
                <h1>{{ introData.title }}</h1>
                <h3>{{ introData.subtitle }}</h3>
                <p>{{ introData.description }}</p>
            </div>
            <div class="image-col" data-aos="fade-left" data-aos-delay="200">
                <img src="assets/ABOUT US.png"
                    alt="Building">
            </div>
        </div>
    </section>

    <section class="section foundation-section">
        <div class="container">
            <div class="section-header">
                <h2>Foundation</h2>
                <div class="separator"></div>
            </div>

            <div class="timeline">
                @for (event of foundationEvents; track event.year; let i = $index) {
                <div class="timeline-item" data-aos="fade-up" [attr.data-aos-delay]="i * 150">
                    <div class="timeline-dot" data-aos="zoom-in" [attr.data-aos-delay]="(i * 150) + 200"></div>
                    <div class="timeline-date">{{ event.year }}</div>
                    <div class="timeline-content">
                        <h3>{{ event.title }}</h3>
                        <p>{{ event.description }}</p>
                    </div>
                </div>
                }
            </div>
        </div>
    </section>

</div>
