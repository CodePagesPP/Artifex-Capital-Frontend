<aside class="sidebar">
  <div class="brand">
    <img src="assets/logo-vertical.png" alt="Logo" class="logo-v">
  </div>

  <nav class="navigation">
    <a *ngFor="let item of menuItems" 
       [routerLink]="item.route" 
       routerLinkActive="active" 
       class="nav-link">
      <i class="fas {{ item.icon }}" style="margin-right: 10px;"></i>
      {{ item.label }}
    </a>
  </nav>

  <footer class="sidebar-footer">
    <button class="btn-exit" (click)="logout()">
      <i class="fas fa-sign-out-alt" style="margin-right: 5px;"></i> Log out
    </button>
  </footer>
</aside>
