<div class="login-wrapper">
  <div class="login-card">
    
    <div class="logo-container">
      <img src="assets/logo.png" alt="Logo Artifex" onerror="this.style.display='none'">
      <h2 *ngIf="false" style="color:var(--color-blue)">ARTIFEX</h2> 
    </div>

    <h1 class="login-title">Welcome</h1>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email" 
          id="email"
          [(ngModel)]="credentials.email"
          name="email"
          #emailInput="ngModel"
          required
          email
          placeholder="ejemplo@correo.com"
          class="form-control"
        />
        <small *ngIf="emailInput.invalid && emailInput.touched" style="color: var(--color-orange); margin-top: 5px; display: block;">
            Enter a valid email address.
        </small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="credentials.password"
          name="password"
          required
          minlength="6"
          placeholder="••••••••"
          class="form-control"
        />
      </div>

      <button type="submit" class="btn-login" [disabled]="loginForm.invalid">
        Login
      </button>

      <div class="error-msg" *ngIf="error">
         {{ error }}
      </div>

      <div class="register-link">
          Don't you have an account? <a routerLink="/register">Register here</a>
      </div>
      <div class="register-link">
          <a routerLink="/forgot-password">Forgot password?</a>
      </div>
    
    </form>
  </div>
</div>
