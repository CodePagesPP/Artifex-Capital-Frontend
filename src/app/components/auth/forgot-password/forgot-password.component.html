<div class="auth-wrapper">
  <div class="auth-card fade-in">
    <div class="card-header">
      <h2>Forgot Password?</h2>
      <p>Enter your email address and we'll send you a link to reset your password.</p>
    </div>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" formControlName="email" placeholder="you@example.com">
        <span class="error-text" *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid">
          Please enter a valid email.
        </span>
      </div>

      <button type="submit" class="btn-primary" [disabled]="forgotForm.invalid || isLoading">
        {{ isLoading ? 'Sending...' : 'Send Reset Link' }}
      </button>

      <div class="auth-links">
        <a routerLink="/login" class="back-link"><i class="fas fa-arrow-left"></i> Back to Login</a>
      </div>
    </form>
  </div>
</div>
