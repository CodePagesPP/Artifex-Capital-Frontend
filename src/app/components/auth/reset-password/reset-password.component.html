<div class="auth-wrapper">
  <div class="auth-card fade-in">
    <div class="card-header">
      <h2>Create New Password</h2>
      <p>Your new password must be different from previous used passwords.</p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      <div class="input-group">
        <label>New Password</label>
        <input type="password" formControlName="newPassword" placeholder="Minimum 6 characters">
      </div>

      <div class="input-group">
        <label>Confirm Password</label>
        <input type="password" formControlName="confirmPassword" placeholder="Repeat password">
        <span class="error-text" *ngIf="resetForm.hasError('mismatch') && resetForm.get('confirmPassword')?.touched">
          Passwords do not match.
        </span>
      </div>

      <button type="submit" class="btn-primary" [disabled]="resetForm.invalid || isLoading">
        {{ isLoading ? 'Saving...' : 'Reset Password' }}
      </button>
    </form>
  </div>
</div>
