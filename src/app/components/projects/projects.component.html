<div class="admin-container">
    <header class="admin-header">
        <div class="header-content">
            <h1>Manage Your Projects</h1>
            <button class="btn-primary" (click)="openCreateModal()">
                <span>+</span> New Project
            </button>
        </div>
    </header>

    <main class="table-responsive">
        <table class="admin-table">
            <thead>
                <tr>
                    <th>Preview</th>
                    <th>Title</th>
                    <th>Location</th>
                    <th>Progress</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let project of projects">
                    <td>
                        <div class="image-preview-container" (click)="openGallery(project)">
                            <img [src]="getImg(project)" class="table-img" alt="preview">
                            <div class="photo-counter" *ngIf="project.photoUrls.length > 1">
                                +{{ project.photoUrls.length - 1 }}
                            </div>
                        </div>
                    </td>
                    <td class="font-bold">{{ project.title }}</td>
                    <td>{{ project.city }}, {{ project.country }}</td>
                    <td>
                        <div class="progress-wrapper">
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" [style.width.%]="project.progress"></div>
                            </div>
                            <span class="progress-text">{{ project.progress }}%</span>
                        </div>
                    </td>
                    <td>
                        <span class="badge" [class.badge-progress]="project.status === 'IN_PROGRESS'"
                            [class.badge-completed]="project.status === 'COMPLETED'">
                            {{ project.status }}
                        </span>
                    </td>
                    <td class="actions-cell">
                        <button class="btn-icon edit" (click)="openEditModal(project)">✏️</button>
                        <button class="btn-icon delete" (click)="deleteProject(project.id!)">🗑️</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>

    <div class="modal-overlay" *ngIf="showGalleryModal" (click)="closeGallery()">
        <div class="gallery-card" (click)="$event.stopPropagation()">
            <div class="modal-header">
                <h2>Image Galery</h2>
                <button class="close-btn" (click)="closeGallery()">×</button>
            </div>
            <div class="gallery-grid">
                <div class="gallery-item" *ngFor="let url of selectedProjectPhotos">
                    <img [src]="projectService.getImgUrl(url)" alt="Project photo">
                    <button class="delete-photo-btn" (click)="removePhoto(url)">×</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" *ngIf="showModal">
        <div class="modal-card">
            <div class="modal-header">
                <h2>{{ isEditMode ? 'Edit Project' : 'New Project' }}</h2>
                <button class="close-btn" (click)="closeModal()">×</button>
            </div>

            <div class="modal-body">
                <form class="vanilla-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Title</label>
                            <input type="text" [(ngModel)]="projectForm.title" name="title"
                                placeholder="Ej: Torre Washington">
                        </div>
                        <div class="form-group">
                            <label>City</label>
                            <input type="text" [(ngModel)]="projectForm.city" name="city">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea [(ngModel)]="projectForm.description" name="description" rows="3"></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Country</label>
                            <input type="text" [(ngModel)]="projectForm.country" name="country">
                        </div>
                        <div class="form-group">
                            <label>Progress (%)</label>
                            <input type="number" [(ngModel)]="projectForm.progress" name="progress">
                        </div>
                        <div class="form-group">
                            <label>Status</label>
                            <select [(ngModel)]="projectForm.status" name="status">
                                <option value="IN_PROGRESS">In Progress</option>
                                <option value="COMPLETED">Completed</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Upload Image</label>
                        <div class="file-input-wrapper">
                            <input type="file" (change)="onFilesSelected($event)" id="file-upload" multiple>
                            <label for="file-upload" class="custom-file-label">
                                {{ selectedFiles.length > 0 ? selectedFiles.length + ' selected files' :
                                'Select files...' }}
                            </label>
                        </div>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button class="btn-secondary" (click)="closeModal()">Cancel</button>
                <button class="btn-primary" (click)="saveProject()">
                    {{ isEditMode ? 'Save Changes' : 'Create Project' }}
                </button>
            </div>
        </div>
    </div>
</div>
